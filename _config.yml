# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Dr. Suat Atan — AI, RAG & Data Solutions
email: suatatan@gmail.com
description: >-
  Dr. Suat Atan builds enterprise RAG, NLP and data solutions and helps
  organizations adopt artificial intelligence through practical training.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://suatatan.com" # the base hostname & protocol for your site
twitter_username: suatatan
github_username:  suatatan

# Social media and SEO
author:
  name: "Dr. Suat ATAN"
  email: "suatatan@gmail.com"
  twitter: "suatatan"

# SEO Settings
lang: en
locale: en_US
google_site_verification: "" # Google Search Console verification code buraya eklenecek
bing_site_verification: "" # Bing verification code buraya eklenecek

# Social Links
social:
  name: Dr. Suat ATAN
  links:
    - https://twitter.com/suatatan
    - https://github.com/suatatan
    - https://www.linkedin.com/in/suat-atan/

# Google Analytics (production için)
google_analytics: "" # Analytics ID buraya eklenecek

# SEO and social media defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      author: "Dr. Suat ATAN"
      image: "/images/social-preview.svg"
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      author: "Dr. Suat ATAN"
      image: "/images/social-preview.svg"

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
future: false

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docs/
  - scripts/
  - pyscripts/
  - podcast-scripts/
  - chrome-extensions/
  - .obsidian/
  - .vscode/
  - "*.py"
  - "*.log"
  - README.md
