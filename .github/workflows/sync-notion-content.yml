name: Sync published Notion content

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Jekyll dependencies
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4
          git restore Gemfile.lock
      - name: Pull published pages from Notion
        env:
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          NOTION_DATA_SOURCE_ID: 53e576c2-7037-4888-82ea-4aa8b9e37f2d
        run: python3 scripts/sync_notion.py
      - name: Validate Jekyll build
        run: bundle exec jekyll build
      - name: Commit generated content
        run: |
          if git diff --quiet; then
            echo "No content changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          if [ -d images/notion ]; then git add images/notion; fi
          git commit -m "Sync published Notion content"
          git push
