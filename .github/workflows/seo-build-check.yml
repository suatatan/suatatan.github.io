name: SEO and Jekyll build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate SEO decisions and routes
        run: python scripts/validate_seo.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Add Linux platform and install gems
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4 --retry 3

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Verify representative built pages
        run: python scripts/verify_built_site.py
